[project]
name = "ensemble-mcp"
version = "0.1.0a7"
description = "MCP server providing vector memory, drift detection, model routing, skills discovery, session management, and codebase indexing for AI-assisted development pipelines."
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Sanjaya De Silva", email = "sanjaya@example.com"},
]
keywords = [
    "mcp",
    "ai",
    "agent",
    "orchestration",
    "vector-memory",
    "drift-detection",
    "model-routing",
    "codebase-indexing",
    "embeddings",
    "onnx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "tokenizers>=0.22.2",
    "rich>=13.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/LynkByte/ensemble"
Repository = "https://github.com/LynkByte/ensemble"
Documentation = "https://github.com/LynkByte/ensemble/tree/main/docs"
Issues = "https://github.com/LynkByte/ensemble/issues"
Changelog = "https://github.com/LynkByte/ensemble/blob/main/CHANGELOG.md"

[project.scripts]
ensemble-mcp = "ensemble_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

# ── Pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that download models or do heavy IO",
]

# ── Ruff ──────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "ARG", # flake8-unused-arguments
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any)
    "S101",    # use of assert (fine in tests)
    "S310",    # urllib audit URL open
    "S603",    # subprocess call
    "S607",    # start process with partial path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "ARG"]
"evals/**" = ["ANN", "S", "ARG"]
"evals/cli.py" = ["E402"]
"evals/runner.py" = ["E402"]

# ── Mypy ──────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
mypy_path = "src"

# ── Coverage ───────────────────────────────────────────────────────
[tool.coverage.run]
source = ["ensemble_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
]

[[tool.mypy.overrides]]
module = [
    "onnxruntime.*",
    "tokenizers.*",
    "mcp.*",
    "rich.*",
    "aiohttp.*",
]
ignore_missing_imports = true
