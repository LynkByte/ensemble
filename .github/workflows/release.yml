name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0b5, 1.0.0)"
        required: true
        type: string
      create_github_release:
        description: "Create GitHub release after publishing to PyPI?"
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: Validate and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          ruff check src/ tests/
          echo "✅ Ruff linting passed"

      - name: Run type checking
        run: |
          mypy src/
          echo "✅ MyPy type check passed"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
          echo "✅ Test suite passed"

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/version = ".*"/version = "${{ github.event.inputs.version }}"/' pyproject.toml
          echo "Updated version to ${{ github.event.inputs.version }}"
          grep 'version =' pyproject.toml | head -1

      - name: Build distributions
        run: |
          python -m build
          echo "✅ Built sdist and wheel"

      - name: Validate distributions with twine
        run: |
          python -m twine check dist/*
          echo "✅ Distribution validation passed"

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v6

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI publication
        run: |
          pip install --upgrade pip
          sleep 10  # Give PyPI time to index
          pip index versions ensemble-mcp | grep "${{ github.event.inputs.version }}" || echo "⚠️ Version may take a moment to appear on PyPI"

  create-tag:
    name: Create Git Tag and Release
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag v${{ github.event.inputs.version }} already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag v${{ github.event.inputs.version }} does not exist, will create"
          fi

      - name: Create and push git tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" \
            -m "Release v${{ github.event.inputs.version }}" \
            -m "Published to PyPI" \
            -m "" \
            -m "GitHub Actions Release Workflow" \
            -m "See https://pypi.org/project/ensemble-mcp/${{ github.event.inputs.version }}/"
          git push origin "v${{ github.event.inputs.version }}"
          echo "✅ Tagged and pushed v${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        if: |
          steps.check_tag.outputs.tag_exists == 'false' &&
          github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: |
            # ensemble-mcp v${{ github.event.inputs.version }}

            Released to [PyPI](https://pypi.org/project/ensemble-mcp/${{ github.event.inputs.version }}/)

            ## Installation

            ```bash
            pip install ensemble-mcp==${{ github.event.inputs.version }}
            ```

            Or via `uvx`:

            ```bash
            uvx ensemble-mcp
            ```

            ## Release Details

            - **Workflow**: GitHub Actions automated release
            - **Build Date**: ${{ github.event.repository.updated_at }}
            - **Commit**: ${{ github.sha }}

            For full changelog, see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, 'a') || contains(github.event.inputs.version, 'b') || contains(github.event.inputs.version, 'rc') }}

  notify:
    name: Notify of Release
    runs-on: ubuntu-latest
    needs: [publish, create-tag]
    if: success()
    steps:
      - name: Release Summary
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**PyPI**: https://pypi.org/project/ensemble-mcp/${{ github.event.inputs.version }}/" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pip install ensemble-mcp==${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
