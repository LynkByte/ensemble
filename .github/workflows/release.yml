name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0b5, 1.0.0)"
        required: true
        type: string
      create_github_release:
        description: "Create GitHub release after publishing to PyPI?"
        required: false
        type: boolean
        default: true

jobs:
  validate:
    name: Validate and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          ruff check src/ tests/
          echo "✅ Ruff linting passed"

      - name: Run type checking
        run: |
          mypy src/
          echo "✅ MyPy type check passed"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
          echo "✅ Test suite passed"

      - name: Validate CHANGELOG.md
        run: |
          VERSION="${{ github.event.inputs.version }}"

          # Check that CHANGELOG.md exists
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found in repository root"
            exit 1
          fi

          # Check for a version section header: ## [X.Y.Z]
          if grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "✅ CHANGELOG.md contains section for version ${VERSION}"
          else
            echo "❌ CHANGELOG.md is missing a section for version ${VERSION}"
            echo ""
            echo "Please add a changelog entry before releasing. Example:"
            echo ""
            echo "  ## [${VERSION}] - $(date +%Y-%m-%d)"
            echo ""
            echo "  ### Added"
            echo "  - Your new feature description"
            echo ""
            echo "  ### Fixed"
            echo "  - Your bug fix description"
            echo ""
            echo "Add this to CHANGELOG.md, commit, push to main, then re-run the workflow."
            exit 1
          fi

          # Check that the version section is not empty (has at least one sub-heading like ### Added)
          VERSION_LINE=$(grep -nE "^## \[${VERSION}\]" CHANGELOG.md | head -1 | cut -d: -f1)
          NEXT_VERSION_LINE=$(awk "NR>${VERSION_LINE} && /^## \[/" CHANGELOG.md | head -1)
          if [ -z "$NEXT_VERSION_LINE" ]; then
            # Last version in file — check from version line to end of file
            SECTION_CONTENT=$(tail -n +"$((VERSION_LINE + 1))" CHANGELOG.md)
          else
            NEXT_LINE=$(grep -nE "^## \[" CHANGELOG.md | awk "NR>1{print; exit}" | cut -d: -f1)
            SECTION_CONTENT=$(sed -n "$((VERSION_LINE + 1)),$((NEXT_LINE - 1))p" CHANGELOG.md)
          fi

          if echo "$SECTION_CONTENT" | grep -qE "^### (Added|Changed|Deprecated|Removed|Fixed|Security)"; then
            echo "✅ Changelog section has content (sub-headings found)"
          else
            echo "⚠️ WARNING: Changelog section for ${VERSION} appears to be empty"
            echo "Consider adding details under ### Added, ### Fixed, ### Changed, etc."
            echo "Proceeding anyway — but please update the changelog after release."
          fi

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/version = ".*"/version = "${{ github.event.inputs.version }}"/' pyproject.toml
          echo "Updated version to ${{ github.event.inputs.version }}"
          grep 'version =' pyproject.toml | head -1

      - name: Build distributions
        run: |
          python -m build
          echo "✅ Built sdist and wheel"

      - name: Validate distributions with twine
        run: |
          python -m twine check dist/*
          echo "✅ Distribution validation passed"

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI publication
        run: |
          pip install --upgrade pip
          sleep 10
          pip index versions ensemble-mcp | grep "${{ github.event.inputs.version }}" || echo "⚠️ Version may take a moment to appear on PyPI"

      - name: Commit version update to git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --exit-code pyproject.toml >/dev/null 2>&1; then
            echo "ℹ️ No version changes to commit (already at target version)"
          else
            echo "📝 Committing version update to pyproject.toml"
            git add pyproject.toml
            git commit -m "chore: bump version to ${{ github.event.inputs.version }} [skip ci]"
            git push origin main
            echo "✅ Version commit pushed to main"
          fi

  create-tag:
    name: Create Git Tag and Release
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag v${{ github.event.inputs.version }} already exists"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag v${{ github.event.inputs.version }} does not exist, will create"
          fi

      - name: Create and push git tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" \
            -m "Release v${{ github.event.inputs.version }}" \
            -m "Published to PyPI" \
            -m "" \
            -m "GitHub Actions Release Workflow" \
            -m "See https://pypi.org/project/ensemble-mcp/${{ github.event.inputs.version }}/"
          git push origin "v${{ github.event.inputs.version }}"
          echo "✅ Tagged and pushed v${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        if: |
          steps.check_tag.outputs.tag_exists == 'false' &&
          github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: |
            # ensemble-mcp v${{ github.event.inputs.version }}

            Released to [PyPI](https://pypi.org/project/ensemble-mcp/${{ github.event.inputs.version }}/)

            ## Installation

            ```bash
            pip install ensemble-mcp==${{ github.event.inputs.version }}
            ```

            Or via `uvx`:

            ```bash
            uvx ensemble-mcp
            ```

            ## Release Details

            - **Workflow**: GitHub Actions automated release
            - **Build Date**: ${{ github.event.repository.updated_at }}
            - **Commit**: ${{ github.sha }}

            For full changelog, see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, 'a') || contains(github.event.inputs.version, 'b') || contains(github.event.inputs.version, 'rc') }}

  notify:
    name: Notify of Release
    runs-on: ubuntu-latest
    needs: [publish, create-tag]
    if: success()
    steps:
      - name: Release Summary
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**PyPI**: https://pypi.org/project/ensemble-mcp/${{ github.event.inputs.version }}/" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pip install ensemble-mcp==${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
